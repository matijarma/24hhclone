<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24 Hours of Happy</title>
  <meta name="description" content="Pharrell Williams' Happy, one hour at a time, synced to your local clock.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1><span class="brand">24</span> Hours of <span class="brand">Happy</span></h1>
  </header>

  <main>
    <div class="stage">
      <div class="ring" id="ring" role="group" aria-label="Hour selector">
        <div class="ring-center">
          <div class="player-frame">
            <div id="player"></div>
          </div>
          <div class="readout" aria-hidden="true">
            <div class="readout-hour" id="readout-hour">--</div>
            <div class="readout-minute" id="readout-minute">--</div>
          </div>
        </div>
        <!-- 24 hour buttons injected by clock.js -->
      </div>

      <div class="controls">
        <button id="prev" class="ctrl" aria-label="Previous hour">&larr;</button>
        <button id="now" class="ctrl ctrl-now" aria-label="Resync to current time">Now</button>
        <button id="playpause" class="ctrl" aria-label="Play or pause">&#9654;&#10074;&#10074;</button>
        <button id="unmute" class="ctrl ctrl-unmute" aria-label="Unmute" hidden>Unmute</button>
        <button id="next" class="ctrl" aria-label="Next hour">&rarr;</button>
      </div>

      <p id="announcer" class="sr-only" aria-live="polite"></p>
    </div>
  </main>

  <footer>
    <p>"Happy" &copy; Pharrell Williams &amp; Back Lot Music. Videos embedded via YouTube. Fan-made tribute.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
